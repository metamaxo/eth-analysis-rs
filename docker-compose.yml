services:
  postgres:
    image: postgres:16-alpine
    container_name: eth-analysis-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: eth_user
      POSTGRES_PASSWORD: eth_password
      POSTGRES_DB: testdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eth_user -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
